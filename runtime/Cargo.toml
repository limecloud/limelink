[package]
name = "limelink-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[dependencies]
chrono = { version = "0.4.43", features = ["serde"] }
hex = "0.4.3"
ring = "0.17.14"
rumqttc = "0.25.1"
rusqlite = { version = "0.31.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_jcs = "0.1.0"
sha2 = "0.10.9"
tokio = { version = "1.49.0", features = ["full"] }
uuid = { version = "1.21.0", features = ["v4", "serde"] }
fs2 = "0.4.3"
